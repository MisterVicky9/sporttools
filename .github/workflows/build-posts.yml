name: Build post index
on:
  push:
    paths: ['posts/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_posts.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posts/index.json feed.xml
          git diff --cached --quiet || (git commit -m "Update post index" && git push)
