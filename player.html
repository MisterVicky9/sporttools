<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vicky+ Player</title>
<link rel="stylesheet" href="vickyplus.css">
<link rel="stylesheet" href="theme.css">
<script src="site.js"></script>
</head>
<body>
<div class="page-nav"><a href="vickyplus.html">← Leaderboards</a></div>
<h2 class="pagetitle" id="pname">Player</h2>
<div class="meta" id="pmeta"></div>

<div class="card">
  <div class="panel"><div class="row">
    <label class="chk"><input type="checkbox" id="splitTeams" checked> Split Teams</label>
    <button class="btn secondary" id="colsBtn" type="button">Columns</button>
    <button class="btn" id="csvBtn" type="button">Download CSV</button>
    <button class="btn" id="cardBtn" type="button">Build Stat Card</button>
  </div></div>
  <div id="pickerHost"></div>
  <div class="status" id="status">Loading…</div>
  <div class="tablewrap"><table id="tbl"></table></div>
  <div id="chartHost" style="margin-top:16px"></div>
  <div class="foot" id="foot"></div>
</div>

<script src="vickyplus-core.js"></script>
<script src="vickyplus-ui.js"></script>
<script>
(function(){
  var $=VPUI.$, esc=VPUI.esc, CTX, SC, PK, mine, cols=[], tableRows=[];
  VPUI.warHref=function(r){ return (r.id&&r.Season!=null&&String(r.SeasonLabel)===String(r.Season)&&!r._career&&true)? 'pitcher-war.html?id='+encodeURIComponent(r.id)+'&season='+r.Season : null; };
  var id=new URLSearchParams(location.search).get('id');

  function render(){
    var split=$('splitTeams').checked, rows=[], seasons=VP.groupBy(mine,function(r){return r.Season;});
    var totals=seasons.map(function(g){ return VP.aggregate(g,CTX); }).sort(function(a,b){return a.Season-b.Season;});
    totals.forEach(function(t){
      if(split && t.rows.length>1){ t.rows.slice().sort(function(a,b){return b.IPt-a.IPt;}).forEach(function(s){ s._k='stint'; rows.push(s); }); t._k='total'; rows.push(t); }
      else { t._k='total'; rows.push(t); }
    });
    var career=VP.aggregate(mine,CTX); career._k='total'; career.SeasonLabel='Career'; career.Team=''; career._career=true;
    if(totals.length>1) rows.push(career);
    tableRows=rows;
    cols=[
      {k:'Season',label:'Season',txt:true,sortable:false,get:function(r){return r.SeasonLabel;}},
      {k:'Team',label:'Team',txt:true,sortable:false,get:function(r){return r._career?'':r.Team;}},
      {k:'V',label:'Vicky+',bold:true,sortable:false,get:function(r){return r.V;},fmt:function(v){return v==null?'':String(Math.round(v));}},
      {k:'VE',label:'Vicky+ ERA',bold:true,sortable:false,get:function(r){return r.VE;},fmt:function(v){return v==null?'':v.toFixed(2);}}
    ].concat(PK.cols('Team').map(function(c){ c.sortable=false; return c; }));
    cols[0].k='Name';  // sticky first column
    VPUI.drawTable({el:$('tbl'),cols:cols,rows:rows,rank:false,rowClass:function(r){return r._k==='stint'?'stint':'total';}});
    VPUI.statChart({host:$('chartHost'), ctx:CTX, rows:totals, seasons:SC.seasons, def:'V',
      pop:function(s){ return SC.totals.filter(function(t){ return t.Season===s && t.IPt>=20; }); }, wt:function(r){ return r.IPt; },
      extra:[{k:'V',label:'Vicky+',get:function(r){return r.V;},fmt:function(v){return String(Math.round(v));}}].concat(CTX.hasERA?[{k:'VE',label:'Vicky+ ERA',get:function(r){return r.VE;},fmt:function(v){return v.toFixed(2);}}]:[])});
    $('status').textContent='';
  }

  VP.fetchData('vickyplus-data.json').then(function(data){
    CTX=VP.load(data); SC=VP.score(CTX);
    mine=SC.recs.filter(function(r){return r.id===id;});
    if(!mine.length){ $('status').className='status err'; $('status').textContent='Player not found.'; return; }
    $('pickerHost').innerHTML=VPUI.PICKER_HTML; PK=new VPUI.Picker(CTX,render);
    var seasons=mine.map(function(r){return r.Season;}), lo=Math.min.apply(null,seasons), hi=Math.max.apply(null,seasons);
    var last=mine.filter(function(r){return r.Season===hi;}).sort(function(a,b){return b.IPt-a.IPt;})[0];
    $('pname').textContent=mine[0].Name; document.title=mine[0].Name+' – Vicky+';
    var career=VP.aggregate(mine,CTX);
    $('pmeta').textContent=(last.Team?last.Team+' · ':'')+(lo===hi?lo:lo+'–'+hi)+' · '+career.IP+' IP in the data · career Vicky+ '+Math.round(career.V);
    $('splitTeams').addEventListener('input',render);
    $('cardBtn').addEventListener('click',function(){
      var tot=tableRows.filter(function(r){return r._k==='total';}), car=tot.filter(function(r){return r._career;})[0];
      var yrs=tot.filter(function(r){return !r._career;}).slice(-(car?5:6));
      var colsC=yrs.concat(car?[car]:[]).map(function(r){ return {label:r.SeasonLabel, row:r, team:VPUI.teamName(r._career?last.Team:r.Team)}; });
      var stat=cols.filter(function(c){return c.k!=='Name';});
      var tm=VPUI.teamName(last.Team);
      VPUI.launchCard(VPUI.buildCardState(colsC,stat,{title:mine[0].Name,team:tm,subtitle:'Season'}));
    });
    $('csvBtn').addEventListener('click',function(){ VPUI.downloadCSV(cols,tableRows,'vickyplus_'+mine[0].Name.replace(/\W+/g,'_')+'.csv',false); });
    render();
  }).catch(function(e){ $('status').className='status err'; $('status').textContent=(location.protocol==='file:'?'Open this page from the website (or a local server). ':'')+e.message; });
})();
</script>
</body>
</html>
